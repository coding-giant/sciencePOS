<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Duka Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6F5C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duka Ledger">
<style>
  :root {
    --bg: #F4F6F4;
    --surface: #FFFFFF;
    --surface-2: #ECEFEB;
    --border: #D9DED6;
    --text: #172420;
    --text-muted: #5C6B62;
    --accent: #1F6F5C;
    --accent-dark: #165445;
    --accent-contrast: #FFFFFF;
    --warn: #B0620E;
    --warn-bg: #FBEEDD;
    --stat-blue: #2E6BB0;
    --stat-purple: #7B4FB5;
    --stat-blue-bg: #E8F0FA;
    --stat-purple-bg: #F2EAFA;
    --danger: #B3261E;
    --danger-bg: #FBEAE8;
    --success-bg: #E7F2EC;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101512;
      --surface: #182019;
      --surface-2: #1E2721;
      --border: #2B362E;
      --text: #E7EEE9;
      --text-muted: #94A69C;
      --accent: #3E9C82;
      --accent-dark: #2E7A66;
      --accent-contrast: #08120E;
      --warn: #E0A253;
      --warn-bg: #382A16;
      --danger: #E17167;
      --danger-bg: #3A1E1B;
      --success-bg: #17301F;
      --stat-blue: #6FA8DC;
      --stat-purple: #B69EE0;
      --stat-blue-bg: #16232E;
      --stat-purple-bg: #251C33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101512;
    --surface: #182019;
    --surface-2: #1E2721;
    --border: #2B362E;
    --text: #E7EEE9;
    --text-muted: #94A69C;
    --accent: #3E9C82;
    --accent-dark: #2E7A66;
    --accent-contrast: #08120E;
    --warn: #E0A253;
    --warn-bg: #382A16;
    --danger: #E17167;
    --danger-bg: #3A1E1B;
    --success-bg: #17301F;
    --stat-blue: #6FA8DC;
    --stat-purple: #B69EE0;
    --stat-blue-bg: #16232E;
    --stat-purple-bg: #251C33;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }

  header.topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top:0; z-index: 5;
  }
  header.topbar .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  header.topbar .brand small { display:block; font-weight:500; font-size:11px; color: var(--text-muted); }
  header.topbar button.ghost {
    background:none; border: 1px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 999px; font-size: 13px; cursor:pointer;
  }

  main { flex:1; padding: 16px; padding-bottom: 90px; overflow-x:hidden; }

  /* ---- role select ---- */
  .role-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height: 88vh; gap: 28px; text-align:center; padding: 24px;}
  .role-screen h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .role-screen p.tag { color: var(--text-muted); margin: 4px 0 0; font-size: 14px;}
  .role-buttons { display:flex; flex-direction:column; gap: 14px; width: 100%; max-width: 320px; }
  .role-btn {
    padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); border-left: 5px solid var(--accent);
    background: var(--surface); cursor:pointer; text-align:left; display:flex; align-items:center; gap:14px;
  }
  .role-btn.cashier-btn { border-left-color: var(--stat-blue); }
  .role-btn .glyph { font-size: 26px; width:40px; text-align:center; }
  .role-btn .label { font-weight:700; font-size:16px; }
  .role-btn .sub { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .role-btn:active { background: var(--surface-2); }

  /* ---- generic ---- */
  .card {
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  label.field { display:block; font-size:12px; color:var(--text-muted); margin-bottom:4px; margin-top:10px; }
  input, select {
    width:100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 15px; font-family: var(--sans);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn {
    padding: 12px 16px; border-radius: 8px; border: none; font-size: 15px; font-weight:600;
    cursor:pointer; width:100%;
  }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-sm { width:auto; padding: 7px 12px; font-size: 13px; }
  .pill { display:inline-block; padding: 2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill-ok { background: var(--success-bg); color: var(--accent); }
  .pill-warn { background: var(--warn-bg); color: var(--warn); }
  .pill-danger { background: var(--danger-bg); color: var(--danger); }

  .tabs { display:flex; gap:6px; margin-bottom: 14px; background: var(--surface-2); padding:4px; border-radius: 999px; overflow-x:auto; }
  .tabs button {
    flex: 0 0 auto; padding: 9px 14px; border-radius: 999px; border:none; background:transparent;
    color: var(--text-muted); font-size: 13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .tabs button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .item-row { display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .item-row:last-child { border-bottom:none; }
  .item-name { font-weight:600; font-size:14px; }
  .item-meta { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .item-actions { display:flex; gap:6px; }
  .icon-btn { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:13px; cursor:pointer; color:var(--text); }

  .empty { text-align:center; color: var(--text-muted); padding: 30px 10px; font-size: 14px; }

  /* ---- cashier grid ---- */
  .product-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 90px; }
  .product-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 12px; text-align:left; cursor:pointer;
    border-left: 5px solid hsl(var(--tile-hue, 165) 55% 45%);
    background: linear-gradient(0deg, hsl(var(--tile-hue, 165) 55% 96%), hsl(var(--tile-hue, 165) 55% 96%));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .product-tile {
      background: linear-gradient(0deg, hsl(var(--tile-hue, 165) 30% 17%), hsl(var(--tile-hue, 165) 30% 17%));
      border-left-color: hsl(var(--tile-hue, 165) 45% 55%);
    }
  }
  :root[data-theme="dark"] .product-tile {
    background: linear-gradient(0deg, hsl(var(--tile-hue, 165) 30% 17%), hsl(var(--tile-hue, 165) 30% 17%));
    border-left-color: hsl(var(--tile-hue, 165) 45% 55%);
  }
  .product-tile:active { filter: brightness(0.96); }
  .product-tile.disabled { opacity:.45; }
  .product-tile .pname { font-weight:700; font-size:14px; margin-bottom:6px; line-height:1.25;}
  .product-tile .pprice { font-family: var(--mono); font-size: 14px; font-weight:700; color: hsl(var(--tile-hue, 165) 55% 32%); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .product-tile .pprice { color: hsl(var(--tile-hue, 165) 60% 72%); }
  }
  :root[data-theme="dark"] .product-tile .pprice { color: hsl(var(--tile-hue, 165) 60% 72%); }
  .product-tile .pstock { font-size:11px; color:var(--text-muted); margin-top:4px; }

  .cart-bar {
    position: fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:560px;
    background: var(--surface); border-top:1px solid var(--border); padding: 10px 14px;
    box-shadow: 0 -4px 14px rgba(0,0,0,.06);
  }
  .cart-summary { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13px; color:var(--text-muted); }
  .cart-summary strong { color: var(--text); font-size:16px; font-family: var(--mono); }

  .modal-backdrop { position:fixed; inset:0; background: rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:20; }
  .modal-sheet {
    background: var(--surface); width:100%; max-width:560px; margin:0 auto; border-radius: 18px 18px 0 0;
    padding: 18px; max-height: 85vh; overflow-y:auto;
  }
  .modal-sheet h3 { margin: 0 0 10px; font-size:17px; }
  .modal-close { display:flex; justify-content:flex-end; margin-bottom: -6px; }
  .modal-close button { background:none; border:none; font-size:20px; color:var(--text-muted); cursor:pointer; }

  .cart-line { display:flex; justify-content:space-between; align-items:center; padding: 8px 0; border-bottom:1px solid var(--border); gap:8px;}
  .cart-line:last-child { border-bottom:none; }
  .cart-price-input { width:84px; padding:6px 8px; font-size:13px; font-family: var(--mono); }
  .qty-stepper { display:flex; align-items:center; gap:8px; }
  .qty-stepper button { width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); font-size:15px; cursor:pointer; color:var(--text); }

  .stat-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat-card { background: var(--surface); border:1px solid var(--border); border-top-width:3px; border-radius: var(--radius); padding: 12px; }
  .stat-card .label { font-size:11px; color:var(--text-muted); text-transform:none; }
  .stat-card .value { font-family: var(--mono); font-size:19px; font-weight:700; margin-top:4px; }

  table.report-table { width:100%; border-collapse: collapse; font-size:13px; }
  table.report-table th { text-align:left; color:var(--text-muted); font-weight:600; font-size:11px; padding: 6px 4px; border-bottom:1px solid var(--border); }
  table.report-table td { padding: 8px 4px; border-bottom:1px solid var(--border); }
  table.report-table td.num, table.report-table th.num { text-align:right; font-family: var(--mono); }

  .toast {
    position: fixed; top: 14px; left:50%; transform:translateX(-50%); z-index:30;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,.2);
  }

  .receipt-preview {
    font-family: var(--mono); font-size: 12px; white-space: pre-wrap; background: var(--surface-2);
    border-radius: 8px; padding: 12px; border: 1px dashed var(--border); line-height:1.5;
  }

  h2.section-title { font-size: 15px; margin: 4px 0 10px; }
  .muted-note { font-size:12px; color:var(--text-muted); margin-top:6px; }

  #printArea { display:none; }
  @media print {
    body > *:not(#printArea) { display:none !important; }
    #printArea {
      display:block !important;
      width: 80mm;
      font-family: var(--mono);
      white-space: pre-wrap;
      font-size: 12px;
      color: #000;
    }
    @page { margin: 4mm; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-firestore-compat.min.js"></script>
<script>
(function(){
  "use strict";
  var STORAGE_KEY = "ledgerpos_data_v1";
  var LOW_STOCK = 5;

  var SUBSCRIPTION_PERIOD_MS = 90 * 24 * 3600 * 1000; // ~3 months

  function defaultData(){
    var now = Date.now();
    return {
      shopName: "My Shop",
      pins: { admin: "1234", cashier: "1111" },
      items: [],
      sales: [],
      debts: [],
      printMethod: "rawbt",
      subscription: { activatedAt: now, expiresAt: now + SUBSCRIPTION_PERIOD_MS }
    };
  }

  function loadData(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultData();
      var parsed = JSON.parse(raw);
      if(!parsed.items) parsed.items = [];
      if(!parsed.sales) parsed.sales = [];
      if(!parsed.pins) parsed.pins = { admin:"1234", cashier:"1111" };
      if(!parsed.shopName) parsed.shopName = "My Shop";
      if(!parsed.debts) parsed.debts = [];
      if(!parsed.printMethod) parsed.printMethod = "rawbt";
      if(!parsed.subscription){
        var now = Date.now();
        parsed.subscription = { activatedAt: now, expiresAt: now + SUBSCRIPTION_PERIOD_MS };
      }
      return parsed;
    } catch(e){
      console.error("load failed", e);
      return defaultData();
    }
  }

  var firebaseConfig = {
    apiKey: "AIzaSyDfUqjeNnzuMPQa-7qLtOTaz2ZhU2yiSP0",
    authDomain: "duka-ledger-5c89c.firebaseapp.com",
    projectId: "duka-ledger-5c89c",
    storageBucket: "duka-ledger-5c89c.firebasestorage.app",
    messagingSenderId: "470433447586",
    appId: "1:470433447586:web:eb8460ae82934deab721fb"
  };
  var cloudDocRef = null;
  var SHOP_ID_KEY = "ledgerpos_shop_id_v1";

  function getSavedShopId(){ try { return localStorage.getItem(SHOP_ID_KEY); } catch(e){ return null; } }
  function saveShopId(id){ try { localStorage.setItem(SHOP_ID_KEY, id); } catch(e){} }
  function clearShopId(){ try { localStorage.removeItem(SHOP_ID_KEY); } catch(e){} }
  function localKeyFor(shopId){ return STORAGE_KEY + "_" + shopId; }
  function generateShopId(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I to avoid confusion
    var id = "";
    for(var i = 0; i < 6; i++){ id += chars.charAt(Math.floor(Math.random()*chars.length)); }
    return id;
  }

  function loadLocalForShop(shopId){
    try {
      var raw = localStorage.getItem(localKeyFor(shopId));
      if(!raw) return defaultData();
      var parsed = JSON.parse(raw);
      if(!parsed.items) parsed.items = [];
      if(!parsed.sales) parsed.sales = [];
      if(!parsed.pins) parsed.pins = { admin:"1234", cashier:"1111" };
      if(!parsed.shopName) parsed.shopName = "My Shop";
      if(!parsed.debts) parsed.debts = [];
      if(!parsed.printMethod) parsed.printMethod = "rawbt";
      if(!parsed.subscription){
        var now = Date.now();
        parsed.subscription = { activatedAt: now, expiresAt: now + SUBSCRIPTION_PERIOD_MS };
      }
      return parsed;
    } catch(e){
      return defaultData();
    }
  }

  function saveLocalOnly(){
    if(!currentShopId) return;
    try { localStorage.setItem(localKeyFor(currentShopId), JSON.stringify(DATA)); }
    catch(e){ console.error("local save failed", e); }
  }

  function saveData(){
    saveLocalOnly();
    if(cloudDocRef){
      cloudDocRef.set(DATA).catch(function(e){
        console.error("cloud save failed", e);
        toast("Saved on this phone — couldn't sync (check internet)");
      });
    }
  }

  function getFirestore(){
    if(typeof firebase === "undefined") return null;
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    return firebase.firestore();
  }

  var cloudUnsubscribe = null;

  function attachCloudListener(shopId){
    var db = getFirestore();
    if(!db) return;
    cloudDocRef = db.collection("shops").doc(shopId);
    if(cloudUnsubscribe){ try { cloudUnsubscribe(); } catch(e){} }
    cloudUnsubscribe = cloudDocRef.onSnapshot(function(snap){
      if(!snap.exists) return;
      DATA = snap.data();
      saveLocalOnly();
      render();
    }, function(err){ console.error("cloud sync error", err); });
  }

  // Existing device reopening a shop it already belongs to.
  function resumeShop(shopId){
    currentShopId = shopId;
    DATA = loadLocalForShop(shopId);
    state.screen = "role";
    render();
    try {
      var db = getFirestore();
      if(!db) return;
      var ref = db.collection("shops").doc(shopId);
      ref.get().then(function(snap){
        if(snap.exists){
          DATA = snap.data();
          saveLocalOnly();
          render();
        }
        attachCloudListener(shopId);
      }).catch(function(e){ console.error("cloud get failed", e); attachCloudListener(shopId); });
    } catch(e){ console.error("cloud init failed", e); }
  }

  // Brand new shop, first device ever (or migrating existing single-shop data).
  function createNewShop(seedData){
    var id = generateShopId();
    currentShopId = id;
    saveShopId(id);
    DATA = seedData || defaultData();
    saveLocalOnly();
    state.screen = "role";
    render();
    try {
      var db = getFirestore();
      if(db){
        db.collection("shops").doc(id).set(DATA).catch(function(e){ console.error("seed failed", e); });
        attachCloudListener(id);
      }
    } catch(e){ console.error("cloud init failed", e); }
  }

  function migrateLegacyIfAny(callback){
    var legacyRaw = null;
    try { legacyRaw = localStorage.getItem(STORAGE_KEY); } catch(e){}
    if(!legacyRaw){ callback(null); return; }
    try {
      var db = getFirestore();
      if(db){
        db.collection("dukaledger").doc("shared").get().then(function(snap){
          callback(snap.exists ? snap.data() : loadData());
        }).catch(function(){ callback(loadData()); });
        return;
      }
    } catch(e){}
    callback(loadData());
  }

  // Joining a shop an admin already set up elsewhere.
  function joinShop(id, onFail){
    var db = getFirestore();
    if(!db){ if(onFail) onFail("No internet connection"); return; }
    db.collection("shops").doc(id).get().then(function(snap){
      if(!snap.exists){ if(onFail) onFail("Shop ID not found"); return; }
      currentShopId = id;
      saveShopId(id);
      DATA = snap.data();
      saveLocalOnly();
      state.screen = "role";
      render();
      attachCloudListener(id);
    }).catch(function(e){ if(onFail) onFail("Could not reach the server"); });
  }

  var currentShopId = null;
  var DATA = defaultData();

  var state = {
    screen: "setup", // setup | role | pinpad | admin | cashier
    pendingRole: null,
    adminTab: "stock",
    cashierTab: "sell",
    reportRange: "today",
    reportCustomFrom: "",
    reportCustomTo: "",
    cart: {}, // itemId -> qty
    checkoutPayment: { type: "cash", name: "", phone: "" },
    editingItemId: null,
    lastReceipt: null
  };

  function showConfirm(message, onConfirm){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = '<div class="modal-sheet">'+
      '<div class="modal-close"><button aria-label="Close">✕</button></div>'+
      '<p style="margin: 6px 0 16px; font-size:15px;">'+esc(message)+'</p>'+
      '<div class="row">'+
        '<button class="btn btn-outline" id="confirmCancelBtn">Cancel</button>'+
        '<button class="btn btn-danger" id="confirmYesBtn">Confirm</button>'+
      '</div>'+
      '</div>';
    document.body.appendChild(backdrop);
    function close(){ backdrop.remove(); }
    backdrop.querySelector(".modal-close button").addEventListener("click", close);
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
    backdrop.querySelector("#confirmCancelBtn").addEventListener("click", close);
    backdrop.querySelector("#confirmYesBtn").addEventListener("click", function(){ close(); onConfirm(); });
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function money(n){ return (Math.round(n*100)/100).toFixed(2); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  // ---------------- subscription / licensing ----------------
  var RENEWAL_SECRET = "SAKI-DUKA-LEDGER-2026"; // shared secret, only Sakitech's code-generator tool should know this
  function simpleHash(str){
    var hash = 5381;
    for(var i = 0; i < str.length; i++){ hash = ((hash << 5) + hash) + str.charCodeAt(i); hash = hash & hash; }
    return Math.abs(hash);
  }
  function periodKeyFor(date){
    return date.getFullYear() + "-" + (date.getMonth() + 1);
  }
  function expectedRenewalCode(date){
    var period = periodKeyFor(date || new Date());
    var raw = simpleHash(RENEWAL_SECRET + period);
    return String(raw % 900000 + 100000); // 6-digit code, valid for the calendar month it's generated in
  }
  function isSubscriptionActive(){
    return Date.now() <= (DATA.subscription ? DATA.subscription.expiresAt : 0);
  }
  function daysLeftOnSubscription(){
    var ms = (DATA.subscription ? DATA.subscription.expiresAt : 0) - Date.now();
    return Math.ceil(ms / (24*3600*1000));
  }
  function tryRenew(code){
    var entered = String(code || "").trim();
    if(entered && entered === expectedRenewalCode(new Date())){
      var base = Math.max(Date.now(), DATA.subscription ? DATA.subscription.expiresAt : 0);
      DATA.subscription = { activatedAt: DATA.subscription ? DATA.subscription.activatedAt : Date.now(), expiresAt: base + SUBSCRIPTION_PERIOD_MS };
      saveData();
      return true;
    }
    return false;

  // ---------------- RawBT printing ----------------
  function b64EncodeUnicode(str){
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1){
      return String.fromCharCode(parseInt(p1, 16));
    }));
  }

  function padRight(s, len){ s = String(s); return s.length >= len ? s.slice(0,len) : s + " ".repeat(len - s.length); }
  function padLeft(s, len){ s = String(s); return s.length >= len ? s.slice(0,len) : " ".repeat(len - s.length) + s; }
  function center(s, len){
    s = String(s);
    if(s.length >= len) return s.slice(0,len);
    var total = len - s.length, left = Math.floor(total/2), right = total-left;
    return " ".repeat(left) + s + " ".repeat(right);
  }
  function lineChar(ch, len){ return ch.repeat(len); }

  function buildReceiptText(sale, paymentInfo){
    var W = 32;
    var lines = [];
    lines.push(center(DATA.shopName || "My Shop", W));
    lines.push(center(new Date(sale.timestamp).toLocaleString(), W));
    lines.push(lineChar("-", W));
    sale.lines.forEach(function(l){
      lines.push(padRight(l.name, W));
      var qtyPrice = l.qty + " x " + money(l.sellPrice);
      var lineTotal = money(l.qty * l.sellPrice);
      lines.push(padRight(qtyPrice, W - 10) + padLeft(lineTotal, 10));
    });
    lines.push(lineChar("-", W));
    lines.push(padRight("TOTAL", W - 10) + padLeft(money(sale.total), 10));
    if(paymentInfo && paymentInfo.type === "credit"){
      lines.push("");
      lines.push(padRight("ON CREDIT", W));
      lines.push(padRight("Customer: " + paymentInfo.name, W));
      if(paymentInfo.phone) lines.push(padRight("Phone: " + paymentInfo.phone, W));
    }
    lines.push("");
    lines.push(center("Thank you!", W));
    lines.push("");
    lines.push(lineChar("-", W));
    lines.push(center("Developed by Sakitech", W));
    lines.push(center("Solutions", W));
    lines.push(center("0724335960", W));
    lines.push("");
    lines.push("");
    return lines.join("\n");
  }

  function printText(text){
    if(DATA.printMethod === "browser"){
      printViaBrowser(text);
      return;
    }
    try {
      var b64 = b64EncodeUnicode(text);
      window.location.href = "rawbt:base64," + b64;
    } catch(e){
      console.error(e);
      toast("Could not reach RawBT — is it installed?");
    }
  }

  function printViaBrowser(text){
    var area = document.getElementById("printArea");
    if(!area){ toast("Print area not found"); return; }
    area.textContent = text;
    setTimeout(function(){ window.print(); }, 50);
  }

  function addOrUpdateItem(data, id){
    if(id){
      var item = DATA.items.find(function(i){ return i.id === id; });
      if(item){ Object.assign(item, data); }
    } else {
      DATA.items.push(Object.assign({ id: uid() }, data));

  function deleteItem(id){
    DATA.items = DATA.items.filter(function(i){ return i.id !== id; });

    render();
  }
  function restockItem(id, addQty, newBuy, newSell){
    var item = DATA.items.find(function(i){ return i.id === id; });
    if(!item) return;
    item.qty += addQty;
    if(!isNaN(newBuy)) item.buyPrice = newBuy;
    if(!isNaN(newSell)) item.sellPrice = newSell;
    saveData();
  }

  function addDebt(data){
    DATA.debts.push(Object.assign({ id: uid(), paid: 0, createdAt: Date.now(), settled: false }, data));
    saveData();
  }
  function debtBalance(debt){ return Math.max(0, debt.total - debt.paid); }
  function recordPayment(id, amount){
    var debt = DATA.debts.find(function(d){ return d.id === id; });
    if(!debt) return;
    debt.paid = Math.min(debt.total, debt.paid + amount);
    debt.settled = debtBalance(debt) <= 0;
    saveData();
  }
  function deleteDebt(id){
    DATA.debts = DATA.debts.filter(function(d){ return d.id !== id; });
    saveData();
    render();
  }

  // ---------------- cart / sale ----------------
  function addToCart(id){
    var item = DATA.items.find(function(i){ return i.id === id; });
    if(!item || item.qty <= 0) return;
    var entry = state.cart[id];
    var curQty = entry ? entry.qty : 0;
    if(curQty >= item.qty){ toast("No more stock left"); return; }
    if(entry){ entry.qty += 1; }
    else { state.cart[id] = { qty: 1, price: item.sellPrice }; }
    render();
  }
  function changeCartQty(id, delta){
    var item = DATA.items.find(function(i){ return i.id === id; });
    var entry = state.cart[id];
    var cur = entry ? entry.qty : 0;
    var next = cur + delta;
    if(next <= 0){ delete state.cart[id]; }
    else if(item && next > item.qty){ toast("Only " + item.qty + " in stock"); return; }
    else { entry.qty = next; }
    render();
  }
  function setCartPrice(id, price){
    var entry = state.cart[id];
    if(!entry) return;
    entry.price = isNaN(price) ? 0 : price;
  }
  function cartTotal(){
    var total = 0;
    Object.keys(state.cart).forEach(function(id){
      var entry = state.cart[id];
      total += entry.price * entry.qty;
    });
    return total;
  }
  function checkout(paymentInfo){
    var ids = Object.keys(state.cart);
    if(ids.length === 0) return;
    paymentInfo = paymentInfo || { type: "cash" };
    var lines = [];
    ids.forEach(function(id){
      var item = DATA.items.find(function(i){ return i.id === id; });
      if(!item) return;
      var entry = state.cart[id];
      var qty = entry.qty;
      var price = entry.price;
      lines.push({ itemId: id, name: item.name, qty: qty, sellPrice: price, listPrice: item.sellPrice, buyPrice: item.buyPrice });
      item.qty -= qty;
    });
    var total = lines.reduce(function(s,l){ return s + l.qty*l.sellPrice; }, 0);
    var profit = lines.reduce(function(s,l){ return s + l.qty*(l.sellPrice - l.buyPrice); }, 0);
    var sale = { id: uid(), timestamp: Date.now(), lines: lines, total: total, profit: profit, paymentType: paymentInfo.type };
    DATA.sales.push(sale);
    if(paymentInfo.type === "credit"){
      var itemsDesc = lines.map(function(l){ return l.qty + "x " + l.name; }).join(", ");
      addDebt({
        name: paymentInfo.name,
        phone: paymentInfo.phone || "",
        total: total,
        note: itemsDesc
      });
    }
    saveData();
    state.cart = {};
    state.checkoutPayment = { type: "cash", name: "", phone: "" };
    printReceipt(sale, paymentInfo);
    toast(paymentInfo.type === "credit" ? "Credit sale recorded — printing receipt" : "Sale recorded — sending to printer");
    render();
  }

  // ---------------- reports ----------------
  function rangeStart(range){
    var d = new Date();
    d.setHours(0,0,0,0);
    if(range === "today") return d.getTime();
    if(range === "week") return d.getTime() - 6*24*3600*1000;
    if(range === "month") return d.getTime() - 29*24*3600*1000;
    return 0;
  }
  function reportBounds(){
    if(state.reportRange === "custom"){
      var start = state.reportCustomFrom ? new Date(state.reportCustomFrom + "T00:00:00").getTime() : 0;
      var end = state.reportCustomTo ? new Date(state.reportCustomTo + "T23:59:59.999").getTime() : Date.now();
      return { start: start, end: end };
    }
    return { start: rangeStart(state.reportRange), end: Date.now() };
  }
  function filteredSales(){
    var bounds = reportBounds();
    return DATA.sales.filter(function(s){ return s.timestamp >= bounds.start && s.timestamp <= bounds.end; });
  }
  function reportSummary(sales){
    var revenue = 0, cost = 0, profit = 0, count = sales.length;
    var perItem = {};
    sales.forEach(function(s){
      revenue += s.total; profit += s.profit;
      s.lines.forEach(function(l){
        cost += l.qty * l.buyPrice;
        if(!perItem[l.name]) perItem[l.name] = { qty:0, revenue:0, profit:0 };
        perItem[l.name].qty += l.qty;
        perItem[l.name].revenue += l.qty*l.sellPrice;
        perItem[l.name].profit += l.qty*(l.sellPrice-l.buyPrice);
      });
    });
    return { revenue: revenue, cost: cost, profit: profit, count: count, perItem: perItem };
  }

        app.querySelector("#restoreFileInput").click();
      });
      app.querySelector("#restoreFileInput").addEventListener("change", function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){
          try {
            var parsed = JSON.parse(reader.result);
            if(!parsed || !Array.isArray(parsed.items) || !Array.isArray(parsed.sales)){
              toast("That doesn't look like a valid backup file");
              return;
            }
            showConfirm("Restore this backup? It will replace all current stock and sales data on this phone.", function(){

              if(!DATA.pins) DATA.pins = { admin:"1234", cashier:"1111" };
              if(!DATA.shopName) DATA.shopName = "My Shop";
              if(!DATA.catalog) DATA.catalog = [];
              saveData();
              toast("Backup restored");
              render();
            });
          } catch(err){
            toast("Could not read that file");
          }
        };
        reader.readAsText(file);
      });
    }
  }

  async function doBackup(){
    var filename = "ledgerpos-backup-" + new Date().toISOString().slice(0,10) + ".json";
    var jsonText = JSON.stringify(DATA, null, 2);

    var downloads = null;
    try {
      if(window.claude && window.claude.use) downloads = await window.claude.use("downloads");
    } catch(e){ downloads = null; }

    if(downloads){
      try {
        await downloads.save({ filename: filename, data: jsonText });
        toast("Backup saved");
        return;
      } catch(e){
        if(e && e.code === "declined") return;
        // fall through to plain browser download below
      }
    }

    try {
      var blob = new Blob([jsonText], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("Backup saved");
    } catch(e){
      toast("Backup failed — try again");
    }
  }

  function hueForId(str){
    var hash = 0;
    for(var i = 0; i < str.length; i++){ hash = str.charCodeAt(i) + ((hash << 5) - hash); }
    return Math.abs(hash) % 360;
  }

  function renderProductGridHtml(){
    if(DATA.items.length === 0){
      return '<div class="empty">No items in stock yet. Ask the admin to add some.</div>';
    }
    var html = '<div class="product-grid">';
    DATA.items.forEach(function(item){
      var disabled = item.qty <= 0;
      var hue = hueForId(item.id);
      html += '<button class="product-tile'+(disabled?" disabled":"")+'" style="--tile-hue:'+hue+'" data-add="'+item.id+'" '+(disabled?"disabled":"")+'>'+
        '<div class="pname">'+esc(item.name)+'</div>'+
        '<div class="pprice">'+money(item.sellPrice)+'</div>'+
        '<div class="pstock">'+(disabled ? "Out of stock" : item.qty+" left")+'</div>'+
      '</button>';
    });
    html += '</div>';
    return html;
  }

  function renderCartBarHtml(){
    var cartIds = Object.keys(state.cart);

    return '<div class="cart-bar">'+
      '<div class="cart-summary"><span>'+count+' item(s) in cart</span><strong>'+money(cartTotal())+'</strong></div>'+
      '<button class="btn btn-primary" id="viewCartBtn">Review &amp; checkout</button>'+
      '</div>';

  function openCartModal(){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    var ids = Object.keys(state.cart);
    var linesHtml = ids.map(function(id){
      var item = DATA.items.find(function(i){ return i.id === id; });
      if(!item) return "";
      var entry = state.cart[id];
      var priceNote = entry.price !== item.sellPrice ? '<span style="color:var(--warn);"> (usual '+money(item.sellPrice)+')</span>' : "";
      return '<div class="cart-line">'+
        '<div style="flex:1;">'+
          '<div class="item-name">'+esc(item.name)+'</div>'+
          '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;">'+
            '<span class="item-meta">Price each</span>'+
            '<input type="number" inputmode="decimal" class="cart-price-input" data-price="'+id+'" value="'+entry.price+'">'+
          '</div>'+
          '<div class="item-meta" data-price-note-for="'+id+'" style="margin-top:2px;">'+priceNote+'</div>'+
        '</div>'+
        '<div class="qty-stepper">'+
          '<button data-dec="'+id+'">−</button><span>'+entry.qty+'</span><button data-inc="'+id+'">+</button>'+
        '</div>'+
      '</div>';
    }).join("");

    var pay = state.checkoutPayment;
    var paymentToggleHtml = '<div class="tabs" style="margin:14px 0 0;">'+
        '<button data-paytype="cash" class="'+(pay.type==="cash"?"active":"")+'">Cash</button>'+
        '<button data-paytype="credit" class="'+(pay.type==="credit"?"active":"")+'">On credit</button>'+
      '</div>';
    var creditFieldsHtml = "";
    if(pay.type === "credit"){
      creditFieldsHtml =
        '<label class="field">Customer name</label><input id="ccName" value="'+esc(pay.name)+'" placeholder="Customer name">'+
        '<label class="field">Phone (optional)</label><input id="ccPhone" type="tel" value="'+esc(pay.phone)+'" placeholder="07...">'+
        '<p class="muted-note">This will be added to Debtors for '+money(cartTotal())+'.</p>';
    }

    backdrop.innerHTML = '<div class="modal-sheet">'+
      '<div class="modal-close"><button aria-label="Close">✕</button></div>'+
      '<h3>Cart</h3>'+
      linesHtml+
      '<div class="cart-summary" style="margin-top:12px;"><span>Total</span><strong id="cartModalTotal">'+money(cartTotal())+'</strong></div>'+
      paymentToggleHtml+
      creditFieldsHtml+
      '<button class="btn btn-primary" id="checkoutBtn" style="margin-top:14px;">Complete sale &amp; print receipt</button>'+
      '</div>';
    document.body.appendChild(backdrop);
    function close(){ backdrop.remove(); }
    backdrop.querySelectorAll(".cart-price-input").forEach(function(inp){
      inp.addEventListener("input", function(){
        var id = inp.getAttribute("data-price");
        var item = DATA.items.find(function(i){ return i.id === id; });
        setCartPrice(id, parseFloat(inp.value));
        var totalEl = backdrop.querySelector("#cartModalTotal");
        if(totalEl) totalEl.textContent = money(cartTotal());
        var noteEl = backdrop.querySelector('[data-price-note-for="'+id+'"]');
        if(noteEl && item){
          noteEl.innerHTML = (state.cart[id].price !== item.sellPrice) ? '<span style="color:var(--warn);">(usual '+money(item.sellPrice)+')</span>' : "";
        }
      });
    });
    function syncPaymentFieldsToState(){
      if(pay.type === "credit"){
        var n = backdrop.querySelector("#ccName");
        var p = backdrop.querySelector("#ccPhone");
        if(n) pay.name = n.value;
        if(p) pay.phone = p.value;
      }
    }
    backdrop.querySelector(".modal-close button").addEventListener("click", function(){ close(); render(); });
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop){ close(); render(); } });
    backdrop.querySelectorAll("[data-inc]").forEach(function(b){
      b.addEventListener("click", function(){ changeCartQty(b.getAttribute("data-inc"), 1); close(); openCartModal(); });
    });
    backdrop.querySelectorAll("[data-dec]").forEach(function(b){
      b.addEventListener("click", function(){ changeCartQty(b.getAttribute("data-dec"), -1); close(); if(Object.keys(state.cart).length){ openCartModal(); } else { render(); } });
    });
    backdrop.querySelectorAll("[data-paytype]").forEach(function(b){
      b.addEventListener("click", function(){
        syncPaymentFieldsToState();
        state.checkoutPayment.type = b.getAttribute("data-paytype");
        close();
        openCartModal();
      });
    });
    backdrop.querySelector("#checkoutBtn").addEventListener("click", function(){
      var invalid = Object.keys(state.cart).some(function(id){ return !(state.cart[id].price > 0); });
      if(invalid){ toast("Enter a valid price for every item"); return; }
      var paymentInfo = { type: pay.type };
      if(pay.type === "credit"){
        var name = backdrop.querySelector("#ccName").value.trim();
        var phone = backdrop.querySelector("#ccPhone").value.trim();
        if(!name){ toast("Enter the customer's name for a credit sale"); return; }
        paymentInfo.name = name;
        paymentInfo.phone = phone;
      }
      checkout(paymentInfo);
      close();
    });
  }

  render(); // shows the setup/loading screen immediately
